<!DOCTYPE html>
<html lang="id-ID">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% feed_meta %}
</head>
<body>
<header class="site-header">
<div class="container">
<a href="{{ '/' | relative_url }}" class="brand">{{ site.title }}</a>
<nav>
<a href="{{ '/' | relative_url }}">Beranda</a>
<a href="{{ '/tentang/' | relative_url }}">Tentang</a>
<a href="{{ '/disclosure/' | relative_url }}">Disclosure</a>
</nav>
</div>
</header>
<main class="container">{{ content }}</main>
<footer class="site-footer">
<div class="container">
<p>© {{ "now" | date: "%Y" }} {{ site.title }} — {{ site.description }}</p>
<p><small>Affiliate disclosure: situs ini berisi affiliate link Shopee. Klik membantu support situs ini tanpa biaya tambahan.</small></p>
</div>
</footer>
</body>
</html>
